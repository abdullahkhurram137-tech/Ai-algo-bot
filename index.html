<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI Trading Bot</title>
<style>
:root{--bg:#0b1020;--cd:#141b30;--bd:#222b45;--tx:#f4f7ff;--mu:#8d99b5;--ok:#63e6a0;--bad:#ff7b8a;--ac:#3d6cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Arial,sans-serif;font-size:14px}
.app{max-width:560px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:21px}
small,.mu{color:var(--mu);font-size:12px}.pill{font-size:11px;padding:6px 10px;border-radius:20px;background:var(--cd);border:1px solid var(--bd)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-top:8px}
.cards .card{margin:0}.card b{display:block;margin-top:4px;font-size:14px}.ok{color:var(--ok)}.bad{color:var(--bad)}
.row{display:flex;gap:8px;margin-top:8px}button{border:0;border-radius:12px;padding:13px;background:var(--ac);color:#fff;font-weight:700;flex:1}
button.g{background:var(--ok);color:#06210f}button.r{background:var(--bad);color:#2a0710}button.s{background:var(--cd);border:1px solid var(--bd)}
input,select{width:100%;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:10px;margin:4px 0;font-size:14px}
#log{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px;height:170px;overflow-y:auto;font-size:12px;margin-top:8px}#log p{margin:0 0 6px}
.h{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--bd);font-size:12px}
</style></head><body><div class="app">
<header><div><h1>AI Trading Bot</h1><small>Auto scan • trade • manage</small></div><div class="pill" id="mode"></div></header>
<div class="cards"><div class="card"><small>Balance</small><b id="bal"></b></div><div class="card"><small>P/L</small><b id="pnl"></b></div><div class="card"><small>Win rate</small><b id="wr"></b></div></div>
<div class="row"><button id="auto"></button><button class="s" id="bt">BACKTEST</button><button class="s" id="set">⚙</button></div>
<div class="card" id="sp" style="display:none"><small>Mode</small><select id="f_mode"><option value="paper">PAPER (fake money)</option><option value="live">LIVE (real money)</option></select>
<label><input type="checkbox" id="f_tn" style="width:auto"> Testnet</label>
<input id="f_key" placeholder="Binance API key"><input id="f_sec" type="password" placeholder="API secret (withdraw OFF)">
<input id="f_ok" placeholder="Live ke liye yahan LIVE likhein"><small>Risk % / trade • Min score (1-9) • Timeframe</small>
<input id="f_risk" type="number" step="0.1" value="1"><input id="f_sc" type="number" value="7"><select id="f_tf"><option>15m</option><option>1h</option><option>5m</option></select>
<button id="sv">SAVE</button></div>
<div class="card" id="posbox"></div><div class="card"><small>Market analysis (score /9)</small><div id="scan"></div></div>
<div id="log"></div><div class="row"><input id="in" placeholder="start, stop, close, backtest, status"><button id="go" style="flex:0 0 60px">OK</button></div>
<div style="margin-top:10px"><small>Trade history</small><div id="hist"></div></div></div>
<script>
const $=i=>document.getElementById(i),f=(n,d=2)=>(+n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const B=window.Android,PUB='https://api.binance.com',WL=['BTCUSDT','ETHUSDT','BNBUSDT','SOLUSDT','XRPUSDT','ADAUSDT','DOGEUSDT','LINKUSDT'];
let S={mode:'paper',testnet:false,key:'',sec:'',risk:1,minScore:7,tf:'15m',slM:1.5,trM:2.5,rr:2.5,fee:.1,slip:.05,maxT:4,maxLoss:3,bal:1000,start:1000,auto:false,pos:null,hist:[],W:0,L:0,GW:0,GL:0,cd:{},day:'',nT:0,dS:1000,scan:[]},busy=0,cbs={},cid=0;
try{Object.assign(S,JSON.parse(localStorage.getItem('tb2')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('tb2',JSON.stringify(S))}catch(e){}},live=()=>S.mode=='live',base=()=>S.testnet?'https://testnet.binance.vision':PUB;
const esc=t=>String(t).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function log(t,u){$('log').innerHTML+=`<p class="${u?'':'mu'}">${u?'You':'Bot'}: ${esc(t)}</p>`;$('log').scrollTop=1e9}
window.__cb=(id,s,t)=>{const c=cbs[id];delete cbs[id];c&&c({s,t})};
function http(m,url,h){return new Promise(res=>{if(!B){fetch(url,{method:m,headers:h}).then(async r=>res({s:r.status,t:await r.text()})).catch(e=>res({s:0,t:String(e)}));return}
 const id=++cid;cbs[id]=res;B.http(id,m,url,JSON.stringify(h||{}),'')})}
async function pub(u){const r=await http('GET',u);if(r.s!=200)throw new Error('HTTP '+r.s+' '+String(r.t).slice(0,80));return JSON.parse(r.t)}
const klines=(s,n)=>pub(`${PUB}/api/v3/klines?symbol=${s}&interval=${S.tf}&limit=${n}`);
async function sg(m,p,q){q.timestamp=Date.now();q.recvWindow=10000;const s=Object.keys(q).map(k=>k+'='+encodeURIComponent(q[k])).join('&');
 const r=await http(m,base()+p+'?'+s+'&signature='+B.hmac(S.sec,s),{'X-MBX-APIKEY':S.key});let j={};try{j=JSON.parse(r.t)}catch(e){}
 if(r.s!=200)throw new Error('Binance: '+(j.msg||String(r.t).slice(0,80)));return j}
const IC={};async function info(s){if(IC[s])return IC[s];const j=await pub(`${base()}/api/v3/exchangeInfo?symbol=${s}`),fl=j.symbols[0].filters,
 ls=fl.find(x=>x.filterType=='LOT_SIZE'),mn=fl.find(x=>x.filterType=='NOTIONAL'||x.filterType=='MIN_NOTIONAL');return IC[s]={step:ls.stepSize,min:+(mn&&mn.minNotional||10)}}
const fl=(q,st)=>(Math.floor(q/+st+1e-9)*+st).toFixed((st.replace(/0+$/,'').split('.')[1]||'').length);
async function free(a){const j=await sg('GET','/api/v3/account',{}),b=j.balances.find(x=>x.asset==a);return b?+b.free:0}
// ---- indicators & strategy ----
const EMA=(a,n)=>{const k=2/(n+1),o=[a[0]];for(let i=1;i<a.length;i++)o.push(a[i]*k+o[i-1]*(1-k));return o};
function feats(k){const c=k.map(x=>+x[4]),h=k.map(x=>+x[2]),l=k.map(x=>+x[3]),v=k.map(x=>+x[5]),rsi=[50],atr=[h[0]-l[0]];let g=0,ls=0;
 for(let i=1;i<c.length;i++){const d=c[i]-c[i-1],u=Math.max(d,0),w=Math.max(-d,0);g=i==1?u:(g*13+u)/14;ls=i==1?w:(ls*13+w)/14;rsi.push(ls==0?100:100-100/(1+g/ls));
  atr.push((atr[i-1]*13+Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1])))/14)}
 return{c,h,l,v,rsi,atr,e20:EMA(c,20),e50:EMA(c,50),e200:EMA(c,200)}}
function score(F,i){if(i<200)return null;const c=F.c[i],r=F.rsi[i];let s=0,w=[],vm=0,hh=0;for(let j=i-19;j<=i;j++)vm+=F.v[j];vm/=20;for(let j=i-20;j<i;j++)hh=Math.max(hh,F.h[j]);
 if(c>F.e200[i]){s+=2;w.push('uptrend')}if(F.e20[i]>F.e50[i]){s+=2;w.push('EMA20>50')}if(c>F.e20[i])s++;if(r>=50&&r<=68){s+=2;w.push('RSI '+r.toFixed(0))}
 if(F.v[i]>=1.2*vm){s++;w.push('volume')}if(c>hh){s++;w.push('breakout')}return{s,ok:s>=S.minScore&&r<70&&c>F.e200[i],vr:F.v[i]/vm,w}}
function mk(px,atr,eq){const d=atr*S.slM;if(!(d>0)||d/px>.05)return null;const q=Math.min(eq*S.risk/100/d,eq*.3/px);return q>0?{e:px,q,stop:px-d,tgt:px+d*S.rr,hi:px}:null}
const trail=(p,a)=>{p.stop=Math.max(p.stop,p.hi-a*S.trM)};
function exitChk(p,lo,hi,op){if(op!=null&&op<=p.stop)return[op,'stop gap'];if(lo<=p.stop)return[p.stop,'stop/trailing'];if(hi>=p.tgt)return[p.tgt,'target'];return null}
// ---- trading ----
async function openPos(c){const L=live(),eq=L?await free('USDT'):S.bal,p=mk(c.price,c.atr,eq);if(!p)return;p.sym=c.sym;
 if(L){const I=await info(c.sym),cost=p.q*c.price;if(cost<I.min*1.05)return log(`${c.sym}: balance kam (min $${I.min})`);
  const o=await sg('POST','/api/v3/order',{symbol:c.sym,side:'BUY',type:'MARKET',quoteOrderQty:Math.floor(cost*100)/100}),q=+o.executedQty,cq=+o.cummulativeQuoteQty;
  if(!(q>0))throw new Error('buy fail');const fill=cq/q,sh=fill-c.price;Object.assign(p,{e:fill,q,cost:cq,stop:p.stop+sh,tgt:p.tgt+sh,hi:fill})}
 else{const fill=c.price*(1+S.slip/100),sh=fill-c.price;Object.assign(p,{e:fill,stop:p.stop+sh,tgt:p.tgt+sh,hi:fill});S.bal-=p.q*fill*S.fee/100}
 S.pos=p;S.nT++;log(`BUY ${c.sym} @ ${f(p.e)} | score ${c.s}/9 (${c.why}) | Stop ${f(p.stop)} | Target ${f(p.tgt)}`)}
async function closePos(px,why,ct){const p=S.pos;let fill=px,pnl;
 if(live()){const I=await info(p.sym),q=Math.min(await free(p.sym.replace('USDT','')),p.q),
  o=await sg('POST','/api/v3/order',{symbol:p.sym,side:'SELL',type:'MARKET',quantity:fl(q,I.step)});fill=+o.cummulativeQuoteQty/+o.executedQty;pnl=+o.cummulativeQuoteQty-p.cost}
 else{fill=px*(1-S.slip/100);const g=(fill-p.e)*p.q-fill*p.q*S.fee/100;S.bal+=g;pnl=g-p.e*p.q*S.fee/100}
 pnl>0?(S.W++,S.GW+=pnl):(S.L++,S.GL-=pnl);S.hist.unshift({s:p.sym,e:p.e,x:fill,p:pnl,w:why});S.hist=S.hist.slice(0,20);S.cd[p.sym]=ct;S.pos=null;
 if(live())S.bal=await free('USDT');log(`SELL ${p.sym} @ ${f(fill)} | ${pnl>=0?'+':''}${f(pnl)} (${why})`)}
async function scan(){const day=new Date().toISOString().slice(0,10);if(S.day!=day){S.day=day;S.nT=0;S.dS=live()?await free('USDT'):S.bal}
 const out=[];for(const sym of WL){try{const k=await klines(sym,300),F=feats(k.slice(0,-1)),i=F.c.length-1,r=score(F,i);if(!r)continue;
  out.push({sym,s:r.s,ok:r.ok,vr:r.vr,price:+k[k.length-1][4],atr:F.atr[i],ct:k[k.length-2][0],why:r.w.join(', ')})}catch(e){log(sym+': '+e.message)}}
 S.scan=out.sort((a,b)=>b.s-a.s||b.vr-a.vr);const cur=live()?await free('USDT'):S.bal;S.bal=live()?cur:S.bal;
 if(S.nT>=S.maxT||(cur-S.dS)/S.dS*100<=-S.maxLoss)return;const best=S.scan.find(x=>x.ok&&x.ct>(S.cd[x.sym]||0));if(best)await openPos(best)}
async function cycle(){if(busy||(!S.auto&&!S.pos))return;busy=1;
 try{if(S.pos){const k=await klines(S.pos.sym,300),F=feats(k.slice(0,-1)),i=F.c.length-1,px=+k[k.length-1][4];S.pos.hi=Math.max(S.pos.hi,px);trail(S.pos,F.atr[i]);
   const r=exitChk(S.pos,px,px);if(r)await closePos(r[0],r[1],k[k.length-2][0])}else await scan()}catch(e){log('⚠ '+e.message)}busy=0;render();save()}
// ---- backtest ----
function bt(k){const F=feats(k),o=k.map(x=>+x[1]);let eq=1000,pos=null,T=[],pk=1000,dd=0;
 for(let i=201;i<k.length;i++){const p=i-1;if(!pos){const r=score(F,p);if(r&&r.ok){const e=o[i]*(1+S.slip/100);pos=mk(e,F.atr[p],eq);if(pos)eq-=pos.q*e*S.fee/100}}
  if(pos){trail(pos,F.atr[p]);const r=exitChk(pos,F.l[i],F.h[i],o[i]);if(r){const px=r[0]*(1-S.slip/100),pl=(px-pos.e)*pos.q-px*pos.q*S.fee/100;eq+=pl;T.push(pl);pos=null}else pos.hi=Math.max(pos.hi,F.h[i])}
  const m=eq+(pos?(F.c[i]-pos.e)*pos.q:0);pk=Math.max(pk,m);dd=Math.max(dd,(pk-m)/pk)}return{T,eq,dd}}
async function runBT(){log(`Backtest chal raha hai: ${WL.length} coins, real data, ${S.tf}...`);let T=[],ret=0,dd=0,n=0,bh=0;
 for(const s of WL){try{const k=await klines(s,1000),r=bt(k);T=T.concat(r.T);ret+=(r.eq/1000-1)*100;dd=Math.max(dd,r.dd*100);bh+=(+k[k.length-1][4]/+k[201][4]-1)*100;n++}catch(e){log(s+': '+e.message)}}
 if(!n)return;const w=T.filter(x=>x>0),gw=w.reduce((a,b)=>a+b,0),gl=-T.filter(x=>x<=0).reduce((a,b)=>a+b,0);
 log(`BACKTEST (last 1000 candles/coin): Trades ${T.length} | Win rate ${T.length?f(w.length/T.length*100,1):0}% | Profit factor ${gl?f(gw/gl):'-'} | Avg return/coin ${f(ret/n)}% | Worst drawdown ${f(dd,1)}% | Buy&hold avg ${f(bh/n)}%`)}
// ---- UI ----
function render(){$('mode').textContent=live()?(S.testnet?'LIVE • TESTNET':'🔴 LIVE'):'PAPER';$('bal').textContent='$'+f(S.bal);
 const pl=S.bal-S.start;$('pnl').textContent=(pl>=0?'+':'')+f(pl)+' ('+f(pl/S.start*100)+'%)';$('pnl').className=pl>=0?'ok':'bad';
 const n=S.W+S.L;$('wr').textContent=n?f(S.W/n*100,0)+'% ('+n+')':'-';$('auto').textContent='BOT: '+(S.auto?'ON':'OFF');$('auto').className=S.auto?'g':'r';
 $('posbox').innerHTML=S.pos?`<b>${S.pos.sym} LONG</b> @ ${f(S.pos.e)}<br><small>Stop ${f(S.pos.stop)} • Target ${f(S.pos.tgt)} • Qty ${S.pos.q.toFixed(6)}</small>`:'<small>Koi open trade nahi. '+(S.auto?'Bot market scan kar raha hai...':'Bot OFF.')+'</small>';
 $('scan').innerHTML=S.scan.length?S.scan.map(x=>`<div class="h"><span>${x.sym.replace('USDT','')}</span><span class="mu">$${f(x.price,x.price<10?4:2)}</span><b class="${x.ok?'ok':''}">${x.s}/9${x.ok?' ✔':''}</b></div>`).join(''):'<small>Bot ON karein, analysis yahan dikhega.</small>';
 $('hist').innerHTML=S.hist.length?S.hist.map(h=>`<div class="h"><span>${h.s} ${h.w}<br><span class="mu">${f(h.e)} → ${f(h.x)}</span></span><b class="${h.p>=0?'ok':'bad'}">${h.p>=0?'+':''}${f(h.p)}</b></div>`).join(''):'<small>Abhi koi trade nahi.</small>'}
const resetStats=()=>{S.W=S.L=S.GW=S.GL=0;S.hist=[];S.cd={};S.scan=[];S.nT=0;S.day=''};
$('sv').onclick=async()=>{if(S.pos)return log('Pehle open trade band karein (close).');
 S.risk=Math.min(5,Math.max(.1,+$('f_risk').value||1));S.minScore=+$('f_sc').value||7;S.tf=$('f_tf').value;S.key=$('f_key').value.trim();S.sec=$('f_sec').value.trim();S.testnet=$('f_tn').checked;
 const m=$('f_mode').value;
 if(m=='live'){if(!S.key||!S.sec||$('f_ok').value.trim()!='LIVE')log('Live ke liye API key, secret aur box mein LIVE likhna zaroori hai.');
  else try{S.mode='live';S.auto=false;S.bal=await free('USDT');S.start=S.bal;resetStats();log('LIVE mode set. Balance $'+f(S.bal)+'. Bot OFF hai, BOT dabayein.')}catch(e){S.mode='paper';log('⚠ '+e.message)}}
 else if(live()){S.mode='paper';S.auto=false;S.bal=S.start=1000;resetStats();log('PAPER mode set.')}else log('Settings save.');
 IC.x=0;render();save()};
$('auto').onclick=()=>{S.auto=!S.auto;log(S.auto?'Bot ON: market scan shuru.':'Bot OFF (open trade manage hota rahega).');render();save();cycle()};
$('bt').onclick=runBT;$('set').onclick=()=>{const d=$('sp').style;d.display=d.display=='none'?'block':'none'};
function cmd(t){t=t.toLowerCase();log(t,1);if(/backtest/.test(t))runBT();else if(/close|sell|becho|nikal/.test(t)){if(S.pos)closePos(S.pos.e,'manual',0).catch(e=>log('⚠ '+e.message));else log('Koi open trade nahi.')}
 else if(/stop|band|ruk/.test(t)){S.auto=false;log('Bot OFF.')}else if(/start|chalu|shuru/.test(t)){S.auto=true;log('Bot ON.');cycle()}
 else if(/status|hal/.test(t))log(`${S.mode.toUpperCase()} | bot ${S.auto?'ON':'OFF'} | balance $${f(S.bal)} | trades ${S.W+S.L} | ${S.pos?S.pos.sym+' open':'no trade'}`);else log('Try: start, stop, close, backtest, status');render();save()}
$('go').onclick=()=>{const v=$('in').value;$('in').value='';v&&cmd(v)};
$('f_mode').value=S.mode;$('f_tn').checked=S.testnet;$('f_key').value=S.key;$('f_sec').value=S.sec;$('f_risk').value=S.risk;$('f_sc').value=S.minScore;$('f_tf').value=S.tf;
log('Salam! PAPER mode mein hoon. BOT dabayein, main market scan karke khud trade karunga.');render();setInterval(cycle,30000);if(S.auto||S.pos)cycle();
</script></body></html>
